<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renegociação de dívidas — Demonstração</title>
  <style>
    :root {
      --blue: #1558b5;
      --blue-button: #2164c5;
      --green: #18a957;
      --ink: #111827;
      --muted: #242424;
      --page: #f1f1f1;
      --line: #e3e3e3;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page);
      color: var(--ink);
    }

    body {
      padding: 6px 18px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: min(100%, 700px);
      min-height: calc(100vh - 12px);
      background: #fff;
      border-radius: 38px;
      padding: 70px 30px 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.03);
    }

    .demo-label {
      display: inline-block;
      margin-bottom: 20px;
      padding: 7px 14px;
      border: 1px solid #d6dce5;
      border-radius: 999px;
      color: #5d6877;
      font-size: 12px;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 42px;
    }

    .brand-mark {
      width: 106px;
      height: 106px;
      position: relative;
      margin-bottom: 16px;
    }

    .brand-mark .yellow {
      position: absolute;
      width: 69px;
      height: 75px;
      left: 5px;
      top: 0;
      background: #ffd800;
    }

    .brand-mark .blue-shape {
      position: absolute;
      width: 49px;
      height: 39px;
      left: 30px;
      top: 20px;
      background: #1762c0;
      border-radius: 0 0 20px 20px;
    }

    .brand-mark .red {
      position: absolute;
      width: 33px;
      height: 75px;
      left: 75px;
      top: 0;
      background: #e62b3d;
      transform: skew(-8deg);
    }

    .brand-mark .blue-dot {
      position: absolute;
      width: 38px;
      height: 38px;
      left: 69px;
      top: 55px;
      border-radius: 50%;
      background: #1762c0;
    }

    .brand-name {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--blue);
    }

    .brand-name span {
      display: block;
      color: var(--green);
      margin-top: 7px;
    }

    .main-text {
      margin: 0;
      max-width: 620px;
      color: #14539c;
      font-size: clamp(25px, 4.3vw, 38px);
      line-height: 1.28;
      font-weight: 700;
      letter-spacing: -.7px;
    }

    .instruction {
      margin: 43px 0 0;
      color: var(--muted);
      font-size: clamp(23px, 4vw, 31px);
      line-height: 1.45;
      font-weight: 400;
    }

    .access {
      width: min(100%, 640px);
      min-height: 109px;
      margin-top: 42px;
      border: 0;
      border-radius: 58px;
      background: var(--blue-button);
      color: #fff;
      font-size: clamp(26px, 4.3vw, 38px);
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .access:hover {
      background: #195ab4;
      transform: translateY(-2px);
    }

    .access:focus-visible {
      outline: 4px solid rgba(33,100,197,.3);
      outline-offset: 4px;
    }

    .notice {
      max-width: 600px;
      margin: 18px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: #667085;
    }

    .footer {
      width: min(100%, 640px);
      border-top: 2px solid var(--line);
      margin-top: 73px;
      padding-top: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      color: #14539c;
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 700;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      body { padding: 0; }

      .card {
        min-height: 100vh;
        border-radius: 0;
        padding: 42px 18px 30px;
      }

      .brand {
        margin-bottom: 32px;
      }

      .brand-mark {
        transform: scale(.78);
        margin-bottom: 0;
        margin-top: -8px;
      }

      .main-text {
        font-size: 26px;
      }

      .instruction {
        margin-top: 34px;
        font-size: 23px;
      }

      .access {
        min-height: 86px;
        margin-top: 34px;
        font-size: 27px;
      }

      .footer {
        margin-top: 58px;
        padding-top: 27px;
        gap: 16px;
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="demo-label"></div>

    <section class="brand" aria-label=>
      <div class="brand-mark" aria-hidden="true">
        <div class="yellow"></div>
        <div class="blue-shape"></div>
        <div class="red"></div>
        <div class="blue-dot"></div>
      </div>
      <h1 class="brand-name">
        NOVO DESENROLA
        <span>BRASIL</span>
      </h1>
    </section>

    <p class="main-text">
      Esta é uma página de renegociação.
      Consulte suas condições.
    </p>

    <p class="instruction">
      Clique no botão abaixo para acessar<br>
      a plataforma
    </p>

    <button class="access" type="button" onclick="acessarPlataforma()">
      ACESSAR AGORA
    </button>

    <p class="notice" id="notice" role="status">
      
    </p>

    <footer class="footer">
      <a href="#privacidade">Política de Privacidade</a>
      <a href="#termos">Termos de Uso</a>
      <a href="#sobre">Sobre nós</a>
      <a href="#cookies">Cookies</a>
    </footer>
  </main>

  <script>
  // ALTERE SOMENTE ESTA LINHA PARA MUDAR O DESTINO DO BOTÃO:
  const LINK_ACESSO = "https://dapper-axolotl-desenrola.netlify.app/";

  function acessarPlataforma() {
    window.location.href = LINK_ACESSO;
  }
</script>
</body>
</html>
